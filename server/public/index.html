<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProxiSpeak - Real-Time Avatar Movement Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }
    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-badge {
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .status-dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .main-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .hud-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      background: #1e293b;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      font-size: 0.9rem;
    }
    .hud-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .hud-label {
      color: #94a3b8;
    }
    .hud-val {
      font-weight: 600;
      color: #f1f5f9;
    }
    .canvas-card {
      position: relative;
      background: #1e293b;
      border-radius: 0.75rem;
      border: 1px solid #334155;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    canvas {
      display: block;
      width: 100%;
      height: 480px;
      background: #090d16;
      cursor: crosshair;
    }
    .controls-hint {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
    }
    .log-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      font-size: 0.82rem;
      max-height: 120px;
      overflow-y: auto;
      font-family: monospace;
    }
    .log-item {
      padding: 2px 0;
      color: #cbd5e1;
    }
    .log-time {
      color: #64748b;
      margin-right: 6px;
    }
    .log-highlight {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>ProxiSpeak Ã¢â‚¬â€ Avatar Movement</h1>
      <p style="color: #94a3b8; font-size: 0.85rem; margin-top: 2px;">
        Real-time multi-user position sync via Socket.IO
      </p>
    </div>
    <div class="status-badge">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Connecting...</span>
    </div>
  </header>

  <div class="main-container">
    <div class="hud-bar">
      <div class="hud-item">
        <span class="hud-label">Your ID:</span>
        <span id="hudMyId" class="hud-val">Ã¢â‚¬â€</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Position:</span>
        <span id="hudMyPos" class="hud-val">(0, 0)</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Active Users:</span>
        <span id="hudUserCount" class="hud-val">1</span>
      </div>
    </div>

    <div class="canvas-card">
      <canvas id="gameCanvas" width="850" height="480"></canvas>
      <div class="controls-hint">
        Ã°Å¸Å½Â® Move: <b>Arrow Keys</b>, <b>W A S D</b>, or <b>Click on Canvas</b>
      </div>
    </div>

    <div class="log-card" style="margin-bottom: 12px; font-family: sans-serif;">
      <label for="sessionParticipant">Communication partner:</label>
      <select id="sessionParticipant" style="margin: 8px; padding: 6px;">
        <option value="">Select a connected user</option>
      </select>
      <button id="startSessionButton" type="button">Start Session</button>
      <button id="endSessionButton" type="button" disabled>End Session</button>
      <span id="sessionStatus" style="margin-left: 8px;">No active session</span>
    </div>    <div class="log-card" id="eventLog">
      <div class="log-item"><span class="log-time">[System]</span> Initializing client...</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const hudMyId = document.getElementById("hudMyId");
    const hudMyPos = document.getElementById("hudMyPos");
    const hudUserCount = document.getElementById("hudUserCount");
    const eventLog = document.getElementById("eventLog");

    function logEvent(msg, highlight = false) {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement("div");
      div.className = "log-item";
      div.innerHTML = `<span class="log-time">[${time}]</span> <span class="${highlight ? 'log-highlight' : ''}">${msg}</span>`;
      eventLog.appendChild(div);
      eventLog.scrollTop = eventLog.scrollHeight;
    }

    // Connect to Socket.IO server
    const socket = io();

    let myId = null;
    let myUser = { x: 425, y: 240, color: "#3B82F6", username: "You" };
    const otherUsers = new Map();

    const MOVE_SPEED = 8;
    const keysDown = {};

    socket.on("connect", () => {
      myId = socket.id;
      statusDot.classList.add("connected");
      statusText.textContent = "Connected";
      hudMyId.textContent = myId.slice(0, 8);
      logEvent(`Connected to Socket.IO server (ID: ${myId})`, true);
    });

    socket.on("disconnect", () => {
      statusDot.classList.remove("connected");
      statusText.textContent = "Disconnected";
      logEvent("Disconnected from server", false);
    });

    // Receive initial active user list
    socket.on("currentUsers", (users) => {
      otherUsers.clear();
      users.forEach((u) => {
        if (u.id === myId) {
          myUser = { ...myUser, ...u, username: "You" };
          updateHud();
        } else {
          otherUsers.set(u.id, u);
        }
      });
      hudUserCount.textContent = otherUsers.size + 1;
      logEvent(`Synchronized ${users.length} active user(s) in virtual office`);
    });

    // When another user joins
    socket.on("userJoined", (user) => {
      if (user.id !== myId) {
        otherUsers.set(user.id, user);
        hudUserCount.textContent = otherUsers.size + 1;
        logEvent(`User joined: ${user.username || user.id.slice(0, 5)} at (${Math.round(user.x)}, ${Math.round(user.y)})`);
      }
    });

    // When another user updates position
    socket.on("userPositionUpdated", (data) => {
      if (otherUsers.has(data.id)) {
        const u = otherUsers.get(data.id);
        u.x = data.x;
        u.y = data.y;
        otherUsers.set(data.id, u);
      } else if (data.id !== myId) {
        otherUsers.set(data.id, {
          id: data.id,
          username: data.username || `User-${data.id.slice(0, 4)}`,
          x: data.x,
          y: data.y,
          color: "#10B981"
        });
        hudUserCount.textContent = otherUsers.size + 1;
      }
    });

    // When a user disconnects
    socket.on("userDisconnected", (data) => {
      const leftId = data && data.id ? data.id : data;
      if (otherUsers.has(leftId)) {
        const u = otherUsers.get(leftId);
        otherUsers.delete(leftId);
        hudUserCount.textContent = otherUsers.size + 1;
        logEvent(`User left: ${u.username || leftId.slice(0, 5)}`);
      }
    });

    // Emit position change
    function broadcastPosition() {
      socket.emit("updatePosition", {
        x: Math.round(myUser.x),
        y: Math.round(myUser.y),
      });
      updateHud();
    }

    function updateHud() {
      hudMyPos.textContent = `(${Math.round(myUser.x)}, ${Math.round(myUser.y)})`;
    }

    // Keyboard handlers
    window.addEventListener("keydown", (e) => {
      keysDown[e.key] = true;
    });

    window.addEventListener("keyup", (e) => {
      keysDown[e.key] = false;
    });

    // Click to move
    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      myUser.x = Math.max(20, Math.min(canvas.width - 20, (e.clientX - rect.left) * scaleX));
      myUser.y = Math.max(20, Math.min(canvas.height - 20, (e.clientY - rect.top) * scaleY));
      broadcastPosition();
    });

    function handleInput() {
      let moved = false;
      if (keysDown["ArrowUp"] || keysDown["w"] || keysDown["W"]) {
        myUser.y = Math.max(20, myUser.y - MOVE_SPEED);
        moved = true;
      }
      if (keysDown["ArrowDown"] || keysDown["s"] || keysDown["S"]) {
        myUser.y = Math.min(canvas.height - 20, myUser.y + MOVE_SPEED);
        moved = true;
      }
      if (keysDown["ArrowLeft"] || keysDown["a"] || keysDown["A"]) {
        myUser.x = Math.max(20, myUser.x - MOVE_SPEED);
        moved = true;
      }
      if (keysDown["ArrowRight"] || keysDown["d"] || keysDown["D"]) {
        myUser.x = Math.min(canvas.width - 20, myUser.x + MOVE_SPEED);
        moved = true;
      }

      if (moved) {
        broadcastPosition();
      }
    }

    // Render loop
    function drawGrid() {
      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 1;
      const gridSize = 40;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function drawAvatar(x, y, color, label, isMe) {
      // Proximity earshot zone (100px radius)
      if (isMe) {
        ctx.beginPath();
        ctx.arc(x, y, 100, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(59, 130, 246, 0.08)";
        ctx.fill();
        ctx.strokeStyle = "rgba(59, 130, 246, 0.35)";
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Avatar circle
      ctx.beginPath();
      ctx.arc(x, y, 18, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = isMe ? "#ffffff" : "#0f172a";
      ctx.lineWidth = isMe ? 3 : 2;
      ctx.stroke();

      // Label
      ctx.font = isMe ? "bold 13px sans-serif" : "12px sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.fillText(label, x, y - 26);

      // Coordinates subtext
      ctx.font = "10px monospace";
      ctx.fillStyle = "#94a3b8";
      ctx.fillText(`(${Math.round(x)}, ${Math.round(y)})`, x, y + 34);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid();

      // Draw other users
      otherUsers.forEach((u) => {
        drawAvatar(u.x, u.y, u.color || "#10B981", u.username || u.id.slice(0, 5), false);
      });

      // Draw my avatar on top
      drawAvatar(myUser.x, myUser.y, myUser.color || "#3B82F6", "You", true);
    }

    function gameLoop() {
      handleInput();
      render();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
      // Communication session controls
    const sessionParticipant = document.getElementById("sessionParticipant");
    const startSessionButton = document.getElementById("startSessionButton");
    const endSessionButton = document.getElementById("endSessionButton");
    const sessionStatus = document.getElementById("sessionStatus");
    let activeSessionId = null;
    function updateSessionParticipants() {
      const selectedId = sessionParticipant.value;
      sessionParticipant.replaceChildren();
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = "Select a connected user";
      sessionParticipant.appendChild(placeholder);
      for (const [id, user] of otherUsers) {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = user.username || `User-${id.slice(0, 5)}`;
        sessionParticipant.appendChild(option);
      }
      if (otherUsers.has(selectedId)) {
        sessionParticipant.value = selectedId;
      }
    }
    function resetSessionControls(message = "No active session") {
      activeSessionId = null;
      sessionStatus.textContent = message;
      endSessionButton.disabled = true;
      startSessionButton.disabled = false;
    }
    // Refresh the partner list after existing user handlers update the map.
    socket.on("currentUsers", updateSessionParticipants);
    socket.on("userJoined", updateSessionParticipants);
    socket.on("userDisconnected", updateSessionParticipants);
    startSessionButton.addEventListener("click", () => {
      const participantId = sessionParticipant.value;
      if (!participantId) {
        sessionStatus.textContent = "Select a connected user first.";
        return;
      }
      startSessionButton.disabled = true;
      sessionStatus.textContent = "Starting session...";
      socket.emit("startCommunicationSession", { participantId }, (result) => {
        if (!result || result.error || !result.sessionId) {
          sessionStatus.textContent =
            (result && result.error) || "Could not start session.";
          startSessionButton.disabled = false;
          return;
        }
        activeSessionId = result.sessionId;
        sessionStatus.textContent = "Communication session active";
        endSessionButton.disabled = false;
        startSessionButton.disabled = true;
        logEvent("Communication session started", true);
      });
    });
    endSessionButton.addEventListener("click", () => {
      if (!activeSessionId) return;
      const sessionId = activeSessionId;
      endSessionButton.disabled = true;
      sessionStatus.textContent = "Ending session...";
      socket.emit("endCommunicationSession", { sessionId }, (result) => {
        if (!result || result.error) {
          sessionStatus.textContent =
            (result && result.error) || "Could not end session.";
          endSessionButton.disabled = false;
          return;
        }
        resetSessionControls();
        logEvent("Communication session ended", true);
      });
    });
    // Handle sessions started by another connected user.
    socket.on("communicationSessionStarted", (session) => {
      if (!session || !session.sessionId) return;
      activeSessionId = session.sessionId;
      sessionStatus.textContent = "Communication session active";
      endSessionButton.disabled = false;
      startSessionButton.disabled = true;
      logEvent("Communication session started by another user", true);
    });
    socket.on("communicationSessionEnded", (session) => {
      if (
        session &&
        session.sessionId &&
        activeSessionId &&
        session.sessionId !== activeSessionId
      ) {
        return;
      }
      resetSessionControls();
      logEvent("Communication session ended", true);
    });
    socket.on("disconnect", () => {
      resetSessionControls("Disconnected from server");
    });
</script>
</body>
</html>
